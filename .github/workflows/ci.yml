name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Docs — status diagram hasn't drifted from status.ts
        run: pnpm docs:check-status-diagram

      - name: Docs — domain boundary (packages/core stays chain-agnostic)
        run: pnpm docs:check-domain-boundary

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8787
          API_URL: http://localhost:8787
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright browsers (Chromium only)
        run: pnpm --filter @checkout/web exec playwright install --with-deps chromium

      # Locally-composed stack (fake off-ramp timing, real ledger watcher
      # disabled via E2E_TEST_MODE - see playwright.config.ts) - runs with no
      # network access to Stellar/anchor infra, only this job's own
      # localhost traffic (issue 5.7).
      - name: E2E - local payment loop
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
