name: uptime

on:
  schedule:
    # Every 5 minutes. The cadence is also load-bearing beyond monitoring: a
    # Render instance spins down after 15 minutes idle, and a spun-down
    # instance is not running the settlement watcher.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run checks
        id: uptime
        env:
          # Least-privilege API keys for the synthetic write check (issue
          # 8.9). Secrets, not vars — these authenticate a write.
          UPTIME_API_KEY: ${{ secrets.UPTIME_API_KEY }}
          UPTIME_MAINNET_API_KEY: ${{ secrets.UPTIME_MAINNET_API_KEY }}
          # Mainnet is only checked once this is actually set — see
          # docs/RUNBOOK.md "Uptime monitoring". No default: an unset value
          # here must mean "not configured", never "check testnet again".
          UPTIME_MAINNET_API_URL: ${{ vars.UPTIME_MAINNET_API_URL }}
          UPTIME_MAINNET_WEB_URL: ${{ vars.UPTIME_MAINNET_WEB_URL }}
          UPTIME_MAINNET_SYNTHETIC_CHECK: ${{ vars.UPTIME_MAINNET_SYNTHETIC_CHECK }}
        run: |
          node scripts/uptime-check.mjs | tee /tmp/uptime.log
          {
            echo "events<<EOF"
            grep '^EVENTS_JSON=' /tmp/uptime.log | sed 's/^EVENTS_JSON=//' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Status lands on its own `status` branch, never on main.
      #
      # The scheduled pinger was disabled in a0f06d1 because a commit every 5
      # minutes buried the actual history of this repo — 470 of its commits are
      # this bot. Parking the output on a branch keeps the check running and
      # main readable, and it sidesteps main's branch protection, which a bot
      # push cannot satisfy anyway. The README badges read from `status`.
      - name: Publish updated status to the status branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmp="$(mktemp -d)"
          cp docs/uptime-state.json docs/STATUS.md docs/uptime-badge-*.json "$tmp/"

          # The check script has just modified these tracked files in place, and
          # git refuses to switch branches over modified tracked files whose
          # content differs between them. The first run got away with it because
          # `status` did not exist yet, so the checkout was a no-op branch
          # create; every run after that failed with "Your local changes would
          # be overwritten by checkout" and the badges silently froze.
          #
          # The copies in $tmp are the payload. The working tree is scratch.
          git checkout -- docs/

          git fetch origin status --depth=1 || true
          if git rev-parse --verify origin/status >/dev/null 2>&1; then
            git checkout -B status origin/status
          else
            git checkout -B status
          fi

          cp "$tmp"/uptime-state.json "$tmp"/STATUS.md "$tmp"/uptime-badge-*.json docs/
          git add docs/uptime-state.json docs/STATUS.md docs/uptime-badge-*.json
          git diff --cached --quiet || git commit -m "chore(uptime): update status [skip ci]"
          git push origin status

      - name: Alert on state changes
        if: steps.uptime.outputs.events != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTS: ${{ steps.uptime.outputs.events }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          gh label create incident --repo "$GITHUB_REPOSITORY" --color "B60205" \
            --description "Uptime check failed twice in a row" --force >/dev/null 2>&1 || true

          echo "$EVENTS" | jq -c '.[]' | while read -r event; do
            type=$(echo "$event" | jq -r '.type')
            target=$(echo "$event" | jq -r '.target')
            label_text=$(echo "$event" | jq -r '.label')
            title="🔴 Uptime: $label_text is down"

            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label incident --search "in:title \"$title\"" --json number --jq '.[0].number // empty')

            if [ "$type" = "failed" ] && [ -z "$existing" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" \
                --label incident \
                --assignee "$REPO_OWNER" \
                --body "Two consecutive uptime checks for **$label_text** ($target) have failed. See [docs/STATUS.md](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/STATUS.md) and the [uptime workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            elif [ "$type" = "recovered" ] && [ -n "$existing" ]; then
              gh issue comment --repo "$GITHUB_REPOSITORY" "$existing" --body "Recovered — the last check for **$label_text** passed."
              gh issue close --repo "$GITHUB_REPOSITORY" "$existing"
            fi
          done
