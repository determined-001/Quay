[package]
name = "quay-attest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "On-chain settlement attestations for Quay payment links."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }

# soroban-env-host 23.x's testutils call ed25519-dalek's `SigningKey::generate`
# with a rand_core 0.6 RNG. Cargo otherwise resolves ed25519-dalek to 3.0.0,
# whose CryptoRng bound is rand_core 0.9 — the two don't unify and the test
# profile fails to compile. 2.x is what soroban-env-host is written against.
ed25519-dalek = "2"
